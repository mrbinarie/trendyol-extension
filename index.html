<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendyol GEL</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 18px;
      color: #242424;
      font: 14px Arial, sans-serif;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0 0 16px; color: #666; }
    input, button { box-sizing: border-box; width: 100%; padding: 10px; }
    input { margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; }
    a { display: block; margin-top: 12px; color: #666; text-align: center; }
    button { border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    #fetch-button { margin-bottom: 8px; background: #f2f2f2; }
    #save-button { background: #f27a1a; color: white; }
    #status { min-height: 16px; margin-top: 10px; color: #666; font-size: 12px; }
  </style>
</head>
<body>
    <h1>Trendyol GEL</h1>
    <p>1 TRY to GEL · Sell rate</p>
    <input name="currency" aria-label="TRY to GEL rate" placeholder="Rate" inputmode="decimal">
    <button id="fetch-button">Refresh rate</button>
    <button id="save-button">Save rate</button>
    <a href="https://bankofgeorgia.ge/en/currencies/GEL-to-TRY#commercial-rates" target="_blank">View BOG exchange rates</a>
    <div id="status" role="status" aria-live="polite"></div>

    <script src="scripts/lib/jquery-1.8.2.min.js"></script>
    <script src="scripts/index.module.js"></script>
  
</body>
</html>
